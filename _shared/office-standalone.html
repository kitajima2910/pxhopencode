const AudioCtx=window.AudioContext||window.webkitAudioContext
let audioCtx=null,soundOn=true,ambientNode=null
function ensureAudio(){if(!audioCtx){try{audioCtx=new AudioCtx}catch(e){}}}
function playAmbient(){if(!soundOn)return;ensureAudio();if(!audioCtx||ambientNode)return;const g=(audioCtx.createGain());g.gain.value=0.01;g.connect(audioCtx.destination);ambientNode={_ns:[],stop(){g.gain.linearRampToValueAtTime(0,audioCtx.currentTime+0.5);setTimeout(()=>{ambientNode._ns.forEach(n=>{try{n.stop()}catch{}});ambientNode=null},600)}};const o=audioCtx.createOscillator();o.type='sine';o.frequency.value=55;const gg=audioCtx.createGain();gg.gain.value=0.05;o.connect(gg);gg.connect(g);o.start();ambientNode._ns.push(o)}
function sfx(t){if(!soundOn)return;ensureAudio();if(!audioCtx)return;try{const g=audioCtx.createGain();g.connect(audioCtx.destination);const now=audioCtx.currentTime;if(t==='footstep'){g.gain.setValueAtTime(0.015,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.05);const o=audioCtx.createOscillator();o.type='triangle';o.frequency.setValueAtTime(80+Math.random()*40,now);o.connect(g);o.start(now);o.stop(now+0.05)}else if(t==='notification'){g.gain.setValueAtTime(0.04,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.15);const o=audioCtx.createOscillator();o.type='sine';o.frequency.setValueAtTime(880,now);o.frequency.setValueAtTime(1100,now+0.06);o.connect(g);o.start(now);o.stop(now+0.15)}else if(t==='task_start'){g.gain.setValueAtTime(0.05,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.25);const o=audioCtx.createOscillator();o.type='sine';o.frequency.setValueAtTime(523,now);o.frequency.setValueAtTime(659,now+0.06);o.frequency.setValueAtTime(784,now+0.12);o.connect(g);o.start(now);o.stop(now+0.25)}else if(t==='contract'){g.gain.setValueAtTime(0.02,now);const o=audioCtx.createOscillator();o.type='triangle';o.frequency.setValueAtTime(300,now);o.frequency.linearRampToValueAtTime(600,now+0.3);o.connect(g);o.start(now);o.stop(now+0.4)}else if(t==='door'){g.gain.setValueAtTime(0.02,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.12);const o=audioCtx.createOscillator();o.type='triangle';o.frequency.setValueAtTime(200,now);o.frequency.linearRampToValueAtTime(100,now+0.12);o.connect(g);o.start(now);o.stop(now+0.12)}}catch(e){}}
function toggleSound(){soundOn=!soundOn;document.getElementById('sndToggle').textContent=soundOn?'🔊':'🔇';if(soundOn)playAmbient();else{if(ambientNode){ambientNode.stop();ambientNode=null}}}
var sndEl=document.getElementById('sndToggle');if(sndEl)sndEl.addEventListener('click',toggleSound)

// TERMINAL
// ============================================================
const pxhTerm={buf:'',hist:[],histIdx:-1,focused:false,cmdRunning:false}
const termInput=document.getElementById('pxhTermInput')
function focusTerminal(){if(termInput){pxhTerm.focused=true;termInput.focus()}}
function blurTerminal(){if(termInput){pxhTerm.focused=false;termInput.blur()}}
if(!termInput){console.log('termInput MISSING')}
if(termInput){termInput.addEventListener('focus',()=>{pxhTerm.focused=true})}
if(termInput){termInput.addEventListener('blur',()=>{pxhTerm.focused=false})}
if(termInput){termInput.addEventListener('keydown',function(e){
  if(e.key==='Enter'){const cmd=this.value.trim();if(!cmd)return;pxhTerm.hist.push(cmd);pxhTerm.histIdx=pxhTerm.hist.length;addLog('> '+cmd,'#00e5ff','pxh-opencode');executePXHCommand(cmd);this.value='';pxhTerm.buf='';e.preventDefault()}
  else if(e.key==='ArrowUp'){if(pxhTerm.histIdx>0){pxhTerm.histIdx--;this.value=pxhTerm.hist[pxhTerm.histIdx]}e.preventDefault()}
  else if(e.key==='ArrowDown'){if(pxhTerm.histIdx<pxhTerm.hist.length-1){pxhTerm.histIdx++;this.value=pxhTerm.hist[pxhTerm.histIdx]}else{pxhTerm.histIdx=pxhTerm.hist.length;this.value=''}e.preventDefault()}
  else if(e.key==='Escape'){if(termInput)termInput.blur();e.preventDefault()}
})}

function executePXHCommand(cmd){
  pxhTerm.cmdRunning=true
  if(typeof applyStateDiff==='function'){
    applyStateDiff({session:{active:true,phase:'Interface',workflow:'/terminal',startTime:Date.now()},agents:{'pxh-opencode':{currentState:'typing',badge:'Exec',message:'Running: '+cmd,active:true,color:'#00e5ff'}},changedAgents:['pxh-opencode']})
  }
  if(typeof acquireVsCodeApi==='function'){
    acquireVsCodeApi().postMessage({command:'pxh_exec',text:cmd})
  }else{
    addLog('[demo] Cannot execute in browser mode','#f85149','pxh-opencode')
    addLog('[demo] Install VSCode extension for real execution','#d29922','pxh-opencode')
    setTimeout(()=>{
      if(typeof applyStateDiff==='function'){
        applyStateDiff({session:{active:false,phase:'idle',workflow:'—'},agents:{'pxh-opencode':{currentState:'idle',badge:'',message:'',active:false}},changedAgents:['pxh-opencode']})}
      pxhTerm.cmdRunning=false},500)
  }
}

})

function calcLayout(){
  const r1y=H*.10, r2y=H*.26, r3y=H*.46, r4y=H*.78
  const pm=chars['pxh-pm'];pm.dx=W*.5;pm.dy=H*.85;pm.ix=W*.5+30;pm.iy=H*.85+60;pm.x=pm.ix;pm.y=pm.iy;pm.tx=pm.ix;pm.ty=pm.iy
  const mon=['pxh-architect','pxh-expert','pxh-fix-bugs']
  mon.forEach((n,i)=>{const cx=W*.25+i*W*.22,cc=chars[n];cc.dx=cx;cc.dy=r2y;cc.ix=cx+20;cc.iy=r2y+70;cc.x=cc.ix;cc.y=cc.iy;cc.tx=cc.ix;cc.ty=cc.iy})
  const lap=['pxh-qa','pxh-review-code','pxh-devops','pxh-ui-ux']
  lap.forEach((n,i)=>{const cx=W*.16+i*W*.2,cc=chars[n];cc.dx=cx;cc.dy=r3y;cc.ix=cx+25;cc.iy=r3y+70;cc.x=cc.ix;cc.y=cc.iy;cc.tx=cc.ix;cc.ty=cc.iy})
  const sh=chars['pxh-save-history'];sh.dx=W*.22;sh.dy=r4y;sh.ix=W*.22+30;sh.iy=r4y+60;sh.x=sh.ix;sh.y=sh.iy;sh.tx=sh.ix;sh.ty=sh.iy
  const hh=chars['pxh-help'];hh.dx=W*.72;hh.dy=r4y;hh.ix=W*.72+30;hh.iy=r4y+60;hh.x=hh.ix;hh.y=hh.iy;hh.tx=hh.ix;hh.ty=hh.iy
  const oc=chars['pxh-opencode'];oc.dx=W*.40;oc.dy=H*.60;oc.ix=W*.40+25;oc.iy=H*.66+65;oc.x=oc.ix;oc.y=oc.iy;oc.tx=oc.ix;oc.ty=oc.iy;oc.mirror=true
  plants.length=0
  plants.push({x:W*.18,y:H*.23,s:22},{x:W*.82,y:H*.22,s:16},{x:W*.15,y:H*.6,s:20})
  plants.push({x:W*.82,y:H*.58,s:14},{x:W*.5,y:H*.94,s:13},{x:W*.82,y:H*.9,s:11})
  POI.length=0
  POI.push({x:W*.48,y:H*.7,ti:'T3'},{x:W*.3,y:H*.85,ti:'T4'},{x:W*.65,y:H*.85,ti:'T1'},{x:W*.5,y:H*.4,ti:'T3'})
  chars._r={r1y,r2y,r3y,r4y,t1t:r4y,t1b:H*.96, t2t:r1y-10,t2b:r2y-5,t3t:r2y-10,t3b:r3y+30, t4t:H*.22,t4b:H*.48}

let fc=0
function hr(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`${r},${g},${b}`}
function dc(hex,f=.6){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgb(${Math.floor(r*f)},${Math.floor(g*f)},${Math.floor(b*f)})`}

function drawPlant(x,y,s){ctx.save();const sw=Math.sin(fc*.015+x)*4;const t=Math.floor(x)%3;const pw=s*.45,ph=s*.6,pr=s*.5;ctx.fillStyle='#5a3830';ctx.beginPath();ctx.moveTo(x-pw*.6,y);ctx.lineTo(x+pw*.6,y);ctx.lineTo(x+pw*.5,y+ph);ctx.lineTo(x-pw*.5,y+ph);ctx.closePath();ctx.fill();ctx.fillStyle='#6b4538';ctx.beginPath();ctx.roundRect(x-pr,y-2,pr*2,5,1.5);ctx.fill();ctx.fillStyle='#3a2a1a';ctx.fillRect(x-pw*.4,y+1,pw*.8,3);if(t===0){ctx.fillStyle='#2d5a1e';for(let i=0;i<4;i++){const lx=x+(i-1.5)*s*.15,ly=y-s*.1-i*s*.25,la=Math.sin(fc*.02+i+sw*.1)*.15;ctx.save();ctx.translate(lx,ly);ctx.rotate(-.15+la+i*.1);ctx.beginPath();ctx.ellipse(0,-s*.3,s*.1,s*.35,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3d7a2e';ctx.beginPath();ctx.ellipse(i*2-3,-s*.38,s*.06,s*.28,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2d5a1e';ctx.restore()}ctx.fillStyle='#4a8a35';for(let i=0;i<3;i++){const lx=x+(i-1)*s*.12;ctx.beginPath();ctx.ellipse(lx,y-s*.6-i*s*.25,s*.07,s*.22,Math.sin(fc*.03+i)*.1,0,Math.PI*2);ctx.fill()}}else if(t===1){ctx.fillStyle='#2a5a1a';ctx.beginPath();ctx.arc(x+sw,y-s*.3,s*.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3a7a2a';ctx.beginPath();ctx.arc(x+sw+5,y-s*.38,s*.38,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4a9a3a';ctx.beginPath();ctx.arc(x+sw-4,y-s*.42,s*.32,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3a8a2f';ctx.beginPath();ctx.arc(x+sw+1,y-s*.5,s*.26,0,Math.PI*2);ctx.fill();ctx.fillStyle='#55aa44';ctx.beginPath();ctx.arc(x+sw-1,y-s*.58,s*.18,0,Math.PI*2);ctx.fill();for(let i=0;i<3;i++){const fx=x+sw+(i-1)*8,fy=y-s*.6-i*3;ctx.fillStyle='#ffdd55';ctx.beginPath();ctx.arc(fx,fy,2.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffaa22';ctx.beginPath();ctx.arc(fx,fy,1.5,0,Math.PI*2);ctx.fill()}}else{for(let i=0;i<5;i++){const a=(i/5)*Math.PI*2+sw*.05,lx=x+Math.cos(a)*s*.3,ly=y-s*.2+Math.sin(a)*s*.15;ctx.save();ctx.translate(lx,ly);ctx.rotate(a+1.2);ctx.fillStyle='#2d6a22';ctx.beginPath();ctx.ellipse(-s*.08,-s*.25,s*.1,s*.3,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3d8a32';ctx.beginPath();ctx.ellipse(-s*.05,-s*.3,s*.06,s*.25,0,0,Math.PI*2);ctx.fill();ctx.restore()}ctx.fillStyle='#4a9a35';ctx.beginPath();ctx.arc(x+sw,y-s*.25,s*.18,0,Math.PI*2);ctx.fill()}ctx.restore()}
function drawServerRack(x,y,w,h){ctx.save();ctx.fillStyle='#111620';ctx.strokeStyle='#252b38';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(x,y,w,h,3);ctx.fill();ctx.stroke();for(let i=0;i<5;i++){const uy=y+4+i*(h-8)/5,bl=Math.sin(fc*.04+i*1.2)>0;ctx.fillStyle=bl?(i%2?'#0a3a2a':'#0a2a3a'):'#0a111a';ctx.fillRect(x+3,uy,w-6,(h-8)/5-2);ctx.fillStyle=bl?(i%2?'#3fb950':'#58a6ff'):'#1a2a2a';ctx.beginPath();ctx.arc(x+w-7,uy+3,1.5,0,Math.PI*2);ctx.fill()}ctx.restore()}
function drawKeyboard(x,y){ctx.save();const kw=42,kh=12;ctx.fillStyle='#1a1d24';ctx.beginPath();ctx.roundRect(x-kw/2,y,kw,kh,2.5);ctx.fill();ctx.fillStyle='#2a2d34';for(let r=0;r<5;r++){ctx.fillRect(x-kw/2+3,y+2+r*2,kw-6,1.4)}ctx.fillRect(x-12,y+9.5,24,1.4);ctx.restore()}
function drawMouse(x,y){ctx.save();ctx.fillStyle='#1a1d24';ctx.beginPath();ctx.ellipse(x,y,6,7.5,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#2a2d34';ctx.lineWidth=0.7;ctx.beginPath();ctx.moveTo(x,y-4);ctx.lineTo(x,y+3);ctx.stroke();ctx.restore()}
function drawAgentMonitor(x,y,ch){if(!ch)return;ctx.save();const mw=54,mh=36,ml=ch._monitorLog||[];ctx.fillStyle='#1a1d24';ctx.beginPath();ctx.roundRect(x-mw/2-1,y-1,mw+2,mh+2,3);ctx.fill();ctx.fillStyle='#22262d';ctx.fillRect(x-mw/2-1,y+mh-8,mw+2,9);ctx.fillStyle='#3a3d44';ctx.beginPath();ctx.arc(x,y+mh-1.5,2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#252830';ctx.fillRect(x-3,y+mh,6,5);ctx.fillStyle='#1a1d24';ctx.beginPath();ctx.roundRect(x-14,y+mh+4,28,4,2);ctx.fill();ctx.save();ctx.beginPath();ctx.rect(x-mw/2+4,y+3,mw-8,mh-14);ctx.clip();ctx.fillStyle='#0a141e';ctx.fillRect(x-mw/2+4,y+3,mw-8,mh-14);if(ml.length){ml.slice(-6).forEach((entry,i)=>{const ly=y+mh-8-(ml.slice(-6).length-1-i)*5;let c='#8cf';if(entry.s){if(AGENTS[entry.s])c=AGENTS[entry.s].c;else if(entry.s.match(/error|fail|debug|fix/i))c='#f85149';else if(entry.s.match(/build|execute|test/i))c='#d29922';else if(entry.s.match(/code|write|edit/i))c='#3fb950'}ctx.fillStyle=c;ctx.font='6px \"Consolas\",monospace';ctx.textAlign='left';const txt=entry.m.length>22?entry.m.slice(0,21)+'…':entry.m;ctx.fillText(txt,x-mw/2+6,ly)})}else if(ch.a.n==='pxh-help'||ch.a.n==='pxh-pm'){ctx.fillStyle='rgba(255,255,255,0.15)';ctx.font='bold 6px \"Consolas\",monospace';ctx.textAlign='center';ctx.fillText(ch.a.n==='pxh-pm'?'CEO Dashboard':ch.a.n==='pxh-help'?'Help Desk Queue':'Waiting...',x,y+14)}ctx.restore();const act=ch.state==='typing'||ch.w;ctx.fillStyle=act?'#3fb950':'#1a2a1a';ctx.beginPath();ctx.arc(x+mw/2-7,y+mh-3,2.5,0,Math.PI*2);ctx.fill();ctx.restore()}

function drawHair(hx,hy,a,g){ctx.fillStyle=a.hc;const hs=a.hs||'short';const hr=14;if(hs==='pony'){ctx.beginPath();ctx.arc(hx,hy,hr,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(hx-hr*.9,hy,hr*1.8,4);ctx.fillStyle='#dd5599';ctx.fillRect(hx+hr*.25,hy+3,hr*.2,3);ctx.fillStyle=a.hc;ctx.beginPath();ctx.moveTo(hx+hr*.4,hy+4);ctx.quadraticCurveTo(hx+hr*1.1,hy-hr*.1,hx+hr*1.2,hy+hr*.4);ctx.quadraticCurveTo(hx+hr*.6,hy+hr*.3,hx+hr*.2,hy+2);ctx.fill()}else if(hs==='long'){ctx.beginPath();ctx.arc(hx,hy,hr,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(hx-hr,hy,hr*.35,hr*.7);ctx.fillRect(hx+hr*.65,hy,hr*.35,hr*.7);ctx.fillRect(hx-hr*.9,hy+hr*.2,hr*.3,hr*.6);ctx.fillRect(hx+hr*.6,hy+hr*.2,hr*.3,hr*.6)}else if(hs==='buzz'){ctx.beginPath();ctx.arc(hx,hy+2,hr*.9,Math.PI,Math.PI*2);ctx.fill()}else if(hs==='spiky'){for(let i=-4;i<=4;i++){const sx=hx+i*4;ctx.beginPath();ctx.moveTo(sx-2,hy-8);ctx.lineTo(sx,hy-8-(8+Math.abs(i)*3));ctx.lineTo(sx+2,hy-8);ctx.fill()}ctx.beginPath();ctx.arc(hx,hy+1,hr*.9,Math.PI,Math.PI*2);ctx.fill()}else if(hs==='curly'){ctx.beginPath();ctx.arc(hx,hy,hr,Math.PI,Math.PI*2);ctx.fill();for(let i=-3;i<=4;i++){ctx.beginPath();ctx.arc(hx+i*5,hy-4,4.5,0,Math.PI*2);ctx.fill()}}else if(hs==='slick'){ctx.beginPath();ctx.arc(hx,hy,hr,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#888899';ctx.fillRect(hx-hr-2,hy-2,5,5);ctx.fillRect(hx+hr-3,hy-2,5,5);ctx.fillStyle=a.hc;ctx.fillRect(hx-hr,hy-hr*.15,hr*2,hr*.4);ctx.fillStyle=dc(a.hc,.75);for(let i=0;i<5;i++){ctx.fillRect(hx-hr*.5+i*3.5,hy-hr*.45-i*2.5,hr*.25,hr*.12)}ctx.fillStyle=a.hc}else if(hs==='messy'){ctx.beginPath();ctx.arc(hx,hy,hr,Math.PI,Math.PI*2);ctx.fill();const spikes=[-4,-2.2,-0.5,1.2,2.8,4.2];spikes.forEach(sx=>{const sh=5+Math.abs(sx)*2.5;ctx.beginPath();ctx.moveTo(hx+sx*5-2.5,hy-5);ctx.lineTo(hx+sx*5+(sx>0?2:-2),hy-5-sh);ctx.lineTo(hx+sx*5+2.5,hy-5);ctx.fill()});ctx.fillStyle=dc(a.hc,.65);ctx.fillRect(hx-9,hy-7,3,9);ctx.fillRect(hx+6,hy-8,2.5,7)}else if(hs==='sidepart'){ctx.beginPath();ctx.arc(hx,hy,hr,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(hx-hr,hy-hr*.1,hr*2,hr*.35);ctx.strokeStyle=dc(a.hc,.5);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(hx-hr*.3,hy-hr*.6);ctx.lineTo(hx-hr*.3,hy+hr*.1);ctx.stroke()}else{ctx.fillStyle=a.hc;ctx.beginPath();ctx.arc(hx,hy,hr,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(hx-hr*.7,hy-2,hr*1.4,5)}}

function drawComicBubble(cx,cy,msgs,accent){if(!msgs)return;const lines=Array.isArray(msgs)?msgs.slice(-2):[msgs];if(!lines.length)return;ctx.save();const maxW=Math.max(...lines.map(m=>m.length))*5+30,bh=Math.min(lines.length,5)*16+20;ctx.fillStyle='#fff';ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(cx-maxW/2,cy-bh,maxW,bh,8);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.strokeStyle='#222';ctx.beginPath();ctx.moveTo(cx-6,cy-2);ctx.lineTo(cx,cy+8);ctx.lineTo(cx+6,cy-2);ctx.closePath();ctx.fill();ctx.stroke();lines.forEach((m,i)=>{ctx.fillStyle='#222';ctx.font='bold 10px \"Segoe UI\",sans-serif';ctx.textAlign='center';ctx.fillText(m,cx,cy-bh+16+i*14)});ctx.restore()}

function drawOutfit(a,bt,bb,bw,g){const oc=a.oc||a.bc;if(a.outfit==='polo'){ctx.fillStyle=oc;ctx.fillRect(-bw+2,bt+4,bw*2-4,3);ctx.fillStyle='#ddd';ctx.beginPath();ctx.arc(0,bt+12,1.5,0,Math.PI*2);ctx.fill()}else if(a.outfit==='suit'){ctx.fillStyle=oc;ctx.beginPath();ctx.moveTo(-bw+1,bt);ctx.lineTo(-bw+4,bt+8);ctx.lineTo(-bw+1,bt+16);ctx.lineTo(-bw+1,bt);ctx.fill();ctx.beginPath();ctx.moveTo(bw-1,bt);ctx.lineTo(bw-4,bt+8);ctx.lineTo(bw-1,bt+16);ctx.lineTo(bw-1,bt);ctx.fill();ctx.fillStyle=a.sk;ctx.fillRect(-2,bt+2,4,3);ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-bw+5,bt+5);ctx.lineTo(-bw+7,bt+2);ctx.lineTo(-bw+9,bt+6);ctx.lineTo(-bw+5,bt+5);ctx.fill();ctx.fillStyle='#d4a020';ctx.beginPath();ctx.arc(-bw+6,bt+14,1.2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(bw-6,bt+14,1.2,0,Math.PI*2);ctx.fill()}else if(a.outfit==='blazer'){ctx.fillStyle=oc;ctx.beginPath();ctx.moveTo(-bw+1,bt);ctx.lineTo(-bw+5,bt+10);ctx.lineTo(-bw+1,bt+18);ctx.lineTo(-bw+1,bt);ctx.fill();ctx.beginPath();ctx.moveTo(bw-1,bt);ctx.lineTo(bw-5,bt+10);ctx.lineTo(bw-1,bt+18);ctx.lineTo(bw-1,bt);ctx.fill()}else if(a.outfit==='hoodie'){ctx.fillStyle=oc;ctx.beginPath();ctx.arc(0,bt+2,bw*.6,Math.PI,0);ctx.fill();ctx.strokeStyle=dc(oc,.5);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-2,bt+4);ctx.lineTo(-2,bt+14);ctx.stroke();ctx.beginPath();ctx.moveTo(2,bt+4);ctx.lineTo(2,bt+14);ctx.stroke()}else if(a.outfit==='jacket'){ctx.fillStyle=oc;ctx.fillRect(-bw+1,bt,bw*2-2,4);ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,bt+4);ctx.lineTo(0,bb-2);ctx.stroke();if(a.pat==='striped'){ctx.strokeStyle=dc(oc,.6);ctx.lineWidth=.8;for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(-bw+3,bt+8+i*5);ctx.lineTo(bw-3,bt+8+i*5);ctx.stroke()}}}else if(a.outfit==='dress'){ctx.fillStyle=oc;ctx.beginPath();ctx.moveTo(-bw+2,bt+2);ctx.lineTo(bw-2,bt+2);ctx.quadraticCurveTo(bw+1,(bt+bb)/2+2,bw+3,bb+5);ctx.lineTo(-bw-3,bb+5);ctx.quadraticCurveTo(-bw-1,(bt+bb)/2+2,-bw+2,bt+2);ctx.closePath();ctx.fill();ctx.fillStyle=dc(oc,.55);ctx.fillRect(-bw+1,(bt+bb)/2-1,bw*2-2,3);if(a.pat==='dotted'){ctx.fillStyle='rgba(255,255,255,0.25)';for(let i=0;i<5;i++)for(let j=0;j<3;j++){ctx.beginPath();ctx.arc(-bw+5+j*7,bt+8+i*5,1.3,0,Math.PI*2);ctx.fill()}}}else if(a.outfit==='shirt'){ctx.fillStyle=oc;ctx.fillRect(-bw+2,bt+3,bw*2-4,2);ctx.fillStyle='#ddd';for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(0,bt+8+i*6,1.2,0,Math.PI*2);ctx.fill()}}else if(a.outfit==='cardigan'){ctx.fillStyle=oc;ctx.beginPath();ctx.moveTo(-bw+1,bt);ctx.lineTo(-bw+5,bt+10);ctx.lineTo(-bw+1,bt+18);ctx.lineTo(-bw+1,bt);ctx.fill();ctx.beginPath();ctx.moveTo(bw-1,bt);ctx.lineTo(bw-5,bt+10);ctx.lineTo(bw-1,bt+18);ctx.lineTo(bw-1,bt);ctx.fill();ctx.fillStyle=a.sk;ctx.fillRect(-3,bt+3,6,3);ctx.fillStyle='#ddd';for(let i=0;i<2;i++){ctx.beginPath();ctx.arc(0,bt+10+i*8,1,0,Math.PI*2);ctx.fill()}}if(a.acc==='tie'){ctx.fillStyle=a.n==='pxh-pm'?'#d4a020':'#c44';ctx.beginPath();ctx.moveTo(-2,bt+2);ctx.lineTo(2,bt+2);ctx.lineTo(3,bt+18);ctx.lineTo(0,bt+20);ctx.lineTo(-3,bt+18);ctx.closePath();ctx.fill();if(a.n==='pxh-pm'){ctx.fillStyle='#f0d060';ctx.fillRect(-3,bt+10,6,1.5)}}else if(a.acc==='bowtie'){ctx.fillStyle='#d29922';ctx.beginPath();ctx.moveTo(-5,bt+3);ctx.lineTo(0,bt+5);ctx.lineTo(5,bt+3);ctx.lineTo(5,bt+7);ctx.lineTo(0,bt+5);ctx.lineTo(-5,bt+7);ctx.closePath();ctx.fill()}else if(a.acc==='scarf'){ctx.fillStyle='#ff8080';ctx.beginPath();ctx.moveTo(-bw+2,bt+2);ctx.quadraticCurveTo(0,bt+8,bw-2,bt+2);ctx.quadraticCurveTo(bw,bt+10,bw-4,bt+14);ctx.quadraticCurveTo(0,bt+12,-bw+4,bt+14);ctx.quadraticCurveTo(-bw,bt+10,-bw+2,bt+2);ctx.fill()}else if(a.acc==='glasses'){ctx.strokeStyle='#333';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(-5,bt-3,4,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(5,bt-3,4,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(-1,bt-3);ctx.lineTo(1,bt-3);ctx.stroke()}else if(a.acc==='badge'){ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(bw-5,bt+8,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 4px sans-serif';ctx.textAlign='center';ctx.fillText('★',bw-5,bt+9)}}

function drawAgentLogDialog(cx,cy,lines,accent){
  if(!lines||!lines.length)return;ctx.save();
  var maxW=Math.max.apply(null,lines.map(function(l){return l.length}))*5.5+40;
  var h=Math.min(lines.length,5)*14+30;
  if(maxW>300)maxW=300;
  ctx.fillStyle='rgba(0,0,0,0.75)';ctx.strokeStyle=accent||'#58a6ff';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.roundRect(cx-maxW/2,cy-h,maxW,h,10);ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='bold 9px sans-serif';ctx.textAlign='center';
  ctx.fillText('Agent Log',cx,cy-h+13);
  ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(cx-maxW/2+8,cy-h+18);ctx.lineTo(cx+maxW/2-8,cy-h+18);ctx.stroke();
  ctx.font='9px \"Consolas\",monospace';ctx.textAlign='left';
  lines.slice(0,5).forEach(function(l,i){
    var c='#c9d1d9';if(l.match(/error|fail|fix|debug/i))c='#f85149';else if(l.match(/build|deploy|ci/i))c='#d29922';else if(l.match(/code|write|edit/i))c='#3fb950';else if(l.match(/design|arch/i))c='#bc8cff';
    ctx.fillStyle=c;ctx.fillText(l.length>50?l.slice(0,49)+'…':l,cx-maxW/2+8,cy-h+33+i*14)
  });
  ctx.restore()
}

function drawCharacter(ch){
  const a=ch.a,x=ch.x,y=ch.y,s=ch.state,ph=fc*.05+ch.ap,br=Math.sin(ph*.7)*(s==='idle'?2:0)
  const g=a.g||'male',sk=a.sk,skd=dc(sk,.75),skl=dc(sk,.9)
  ctx.save();ctx.translate(x,y+ch.by)
  const st=s==='idle'||s==='walking'
  ctx.fillStyle='rgba(0,0,0,0.18)';ctx.beginPath();ctx.ellipse(0,st?-2:-8,st?11:17,4,0,0,Math.PI*2);ctx.fill()
  if(st){
    const wc=Math.sin(ph*3),ls=s==='walking'?wc*7:0,bw=g==='female'?11:12
    const las=s==='walking'?Math.sin(ph*4)*7:0
    ctx.fillStyle='#2a2e38';ctx.save();ctx.translate(-5,-20);if(s==='walking')ctx.rotate(las*.04);ctx.fillRect(-3,0,7,18);ctx.fillStyle='#1a1d24';ctx.fillRect(-4,15,10,4);ctx.restore()
    ctx.save();ctx.translate(5,-20);if(s==='walking')ctx.rotate(-las*.04);ctx.fillRect(-4,0,7,18);ctx.fillStyle='#1a1d24';ctx.fillRect(-5,15,10,4);ctx.restore()
    const bt=-48,bb=-21;ctx.fillStyle=a.bc;ctx.beginPath()
    if(g==='female'){ctx.moveTo(-bw+1,bb);ctx.lineTo(bw-1,bb);ctx.quadraticCurveTo(bw+1,(bt+bb)/2,bw-1,bt);ctx.quadraticCurveTo(-bw+1,(bt+bb)/2,-bw+1,bb)}
    else{ctx.moveTo(-bw,bb);ctx.lineTo(bw,bb);ctx.lineTo(bw-1,bt);ctx.lineTo(-bw+1,bt)}
    ctx.closePath();ctx.fill()
    drawOutfit(a,bt,bb,bw,g)
    ctx.fillStyle=dc(a.bc,.7);ctx.fillRect(-5,bt+2,10,3)
    const aas=s==='walking'?Math.sin(ph*2.5)*10:0,aw=g==='female'?5:6
    ctx.fillStyle=a.bc;ctx.save();ctx.translate(-bw,bt+5);ctx.rotate(-.25+aas*.03);ctx.fillRect(-aw/2,0,aw,18);ctx.fillStyle=skl;ctx.beginPath();ctx.arc(0,19,4.5,0,Math.PI*2);ctx.fill();ctx.restore()
    ctx.save();ctx.translate(bw,bt+5);ctx.rotate(.25-aas*.03);ctx.fillRect(-aw/2,0,aw,18);ctx.fillStyle=skl;ctx.beginPath();ctx.arc(0,19,4.5,0,Math.PI*2);ctx.fill();ctx.restore()
    const hcy=bt-8+br;ctx.fillStyle=sk;ctx.beginPath();ctx.arc(0,hcy,13,0,Math.PI*2);ctx.fill()
    ctx.fillStyle=skd;ctx.beginPath();ctx.arc(-13,hcy+1,3.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(13,hcy+1,3.5,0,Math.PI*2);ctx.fill()
    drawHair(0,hcy,a,g)
    const blink=Math.sin(ph*0.35)>.92
    if(blink){ctx.strokeStyle='#2a2a3a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-9,hcy);ctx.lineTo(-1,hcy);ctx.stroke();ctx.beginPath();ctx.moveTo(1,hcy);ctx.lineTo(9,hcy);ctx.stroke()}

function applyStateDiff(diff){if(!diff)return
  var now=Date.now()
  // Session state
  if(diff.session){state._sessionActive=diff.session.active||false
    if(diff.session.workflow){document.getElementById('wfVal').textContent=diff.session.workflow}
    if(diff.session.phase){document.getElementById('phVal').textContent=diff.session.phase}
  }
  // Agent state
  var changed=diff.changedAgents||Object.keys(diff.agents||{})
  changed.forEach(function(id){
    var ag=diff.agents?diff.agents[id]:null
    if(!ag||!chars[id])return
    var ch=chars[id]
    // Track previous state for transition detection
    var prevActive=ch.w
    var prevState=ch.ts
    // New state
    ch.w=ag.active||false
    ch.ts=ag.badge||''
    ch.tsm=ag.currentState||''
    ch._bcol=ag.color||'#888'
    ch._lastEvt=now
    // Monitor log - tool usage tracking
    if(ag.activeTool&&ag.activeTool!==prevState){
      var toolName=ag.activeTool
      var logMsg=ag.message||'Working...'
      ch._monitorLog.push({s:id,m:'['+toolName+'] '+logMsg,t:now})
      // Also push to pxh-opencode's monitor if it exists
      var ocT=chars['pxh-opencode']
      if(ocT&&id!=='pxh-opencode'){
        ocT._monitorLog.push({s:id,m:'['+toolName+'] '+logMsg,t:now})
      }
    }else if(ag.message&&(!ag.activeTool||ag.activeTool===prevState)){
      // Non-tool messages (e.g. workflow_start, status updates)
      ch._monitorLog.push({s:id,m:ag.message,t:now})
      var ocT=chars['pxh-opencode']
      if(ocT&&id!=='pxh-opencode'){
        ocT._monitorLog.push({s:id,m:ag.message,t:now})
      }
    }
    // Session/Archive tracking
    if(ag.active&&!prevActive){
      ch._sessionArchive.push({start:now,type:'session'})
    }else if(!ag.active&&prevActive&&ch._sessionArchive.length){
      ch._sessionArchive[ch._sessionArchive.length-1].end=now
    }
    // Walking behavior: active agents walk to desk, idle agents leave desk
    if(ag.active&&ch.state!=='walking'){
      ch.state='walking';ch.tx=ch.ix;ch.ty=ch.iy
      // Speech bubble
      ch._msgs=ch._msgs||[]
      if(ag.message){ch._msgs.push(ag.badge+': '+ag.message)}
    }else if(!ag.active&&prevActive&&ch.state==='walking'){
      // Don't interrupt walking
    }else if(!ag.active&&ch.state!=='idle'&&ch.state!=='walking'){
      ch.state='idle';ch.tx=ch.x;ch.ty=ch.y
      // Keep last messages visible briefly
      setTimeout(function(){if(ch&&!ch.w){ch._msgs=[];ch.tsm=''}},5000)
    }
    // Message/status update for active agents
    if(ag.active&&ag.message){
      ch._msgs=ch._msgs||[]
      if(ch._msgs.length>5)ch._msgs.shift()
      ch._msgs.push(ag.badge+': '+ag.message)
    }
  })
  // Update mode display
  if(diff.session){var modeEl=document.getElementById('modeTxt');if(modeEl){modeEl.textContent=diff.session.active?'🟢 Active':'⚪ Idle'}}
  // Send events to opencode-activity.log if available
  if(typeof addLog==='function'){addLog('state diff applied','#58a6ff','pxh-opencode')}
}

// ============================================================
// ANIMATION LOOP
// ============================================================
var titleEl=document.querySelector('.title-bar h1')
var phases=['Working','Processing','Thinking','Coding','Reviewing','Debugging']

function animate(){
  fc++
  // Update
  updateCat()
  updateDog()
  Object.values(chars).forEach(function(ch){
    if(!ch)return;var s=ch.state
    // Walking animation
    if(s==='walking'){
      var dx=ch.tx-ch.x,dy=ch.ty-ch.y,dist=Math.sqrt(dx*dx+dy*dy)
      if(dist<2){ch.x=ch.tx;ch.y=ch.ty;ch.state='typing'}else{ch.x+=dx/dist*1.5;ch.y+=dy/dist*1.5}
      ch.wp+=.03
    }else if(s==='typing'){
      ch.wp+=.1
    }
    // Idle animation
    if(s==='idle'){ch.wp+=.01}
    // Auto-close speech bubble after timeout
    if(ch._lastEvt&&ch.tsm){
      var elapsed=now-ch._lastEvt
      var isActive=state._sessionActive||false
      var isIdle=!isActive||ch.tsm==='idle'
      var bubbleTimeout=isIdle?3000:8000
      if(elapsed>bubbleTimeout){
        ch.tsm=''
        if(ch._msgs&&isIdle){ch._msgs=[]}
      }
    }
  })
  // Render
  var now=Date.now()
  ctx.save()
  ctx.clearRect(0,0,W,H)
  // Background
  drawWalls(ctx,wallLight[wfloor])
  drawFloor(ctx,wallLight[wfloor],true)
  // Plants
  plants.forEach(function(p){drawPlant(p.x,p.y,p.s)})
  // Lamps
  drawLamp(ctx,W*.1,H*.92);drawLamp(ctx,W*.9,H*.92);drawLamp(ctx,W*.05,H*.45)
  // Wall art
  drawWallArt(ctx,W*.05,H*.06,40,22);drawWallArt(ctx,W*.95,H*.06,40,22)
  // Tier indicators
  drawTierIndicator(ctx,W*.5,H*.05,'T2','#d29922')
  drawTierIndicator(ctx,W*.3,H*.2,'T3','#3fb950')
  drawTierIndicator(ctx,W*.6,H*.4,'T4','#bc8cff')
  drawTierIndicator(ctx,W*.85,H*.72,'T1','#58a6ff')
  // Desks — draw BEFORE characters so characters sit behind/on desks
  // PM desk (T2 - center bottom)
  drawPMDesk(chars['pxh-pm'].dx,chars['pxh-pm'].dy+50)
  drawMonitor(chars['pxh-pm'].dx+30,chars['pxh-pm'].dy+29)
  // T3 desks (left side - middle row)
  var t3Rows=[chars['pxh-architect'],chars['pxh-expert'],chars['pxh-fix-bugs']]
  t3Rows.forEach(function(ch){if(ch){drawDesk(ch.dx,ch.dy+50,60,30);drawLaptop(ch.dx,ch.dy+28);drawAgentMonitor(ch.dx+15,ch.dy+22,ch)}})
  // T3/T4 laptops (right side - lower desk row)
  var t34Lap=[chars['pxh-qa'],chars['pxh-review-code'],chars['pxh-devops'],chars['pxh-ui-ux']]
  t34Lap.forEach(function(ch){if(ch){drawDesk(ch.dx,ch.dy+50,54,26);drawLaptop(ch.dx,ch.dy+28);drawAgentMonitor(ch.dx+13,ch.dy+20,ch)}})
  // T4 Historian desk
  drawDesk(chars['pxh-save-history'].dx,chars['pxh-save-history'].dy+50,56,28)
  drawLaptop(chars['pxh-save-history'].dx,chars['pxh-save-history'].dy+28)
  drawAgentMonitor(chars['pxh-save-history'].dx+15,chars['pxh-save-history'].dy+22,chars['pxh-save-history'])
  // T1 Help desk
  drawDesk(chars['pxh-help'].dx,chars['pxh-help'].dy+50,56,28)
  // PXHOpenCode terminal desk
  drawDesk(chars['pxh-opencode'].dx,chars['pxh-opencode'].dy+50,65,32)
  drawMonitor(chars['pxh-opencode'].dx+30,chars['pxh-opencode'].dy+30)
  // POI indicators
  POI.forEach(function(p){drawTierIndicator(ctx,p.x,p.y,p.ti,p.ti==='T1'?'#58a6ff':p.ti==='T2'?'#d29922':p.ti==='T3'?'#3fb950':'#bc8cff')})
  // Contracts (signal lines)
  contracts.forEach(function(c,i){drawContract(c);c.life--;if(c.life<=0)contracts.splice(i,1)})
  // Characters
  Object.values(chars).forEach(function(ch){if(ch){drawCharacter(ch)}})
  // Pets (drawn after characters so they appear on top)
  drawCat(cat)
  drawDog(dog)
  // Server rack
  drawServerRack(W*.7,H*.64,36,44)
  // Status bar update
  var elapsed=Math.floor((Date.now()-state.session.startTime)/1000)
  var hrs=Math.floor(elapsed/3600),mins=Math.floor((elapsed%3600)/60),secs=elapsed%60
  var elEl=document.getElementById('elVal')
  if(elEl){elEl.textContent=(hrs<10?'0':'')+hrs+':'+(mins<10?'0':'')+mins+':'+(secs<10?'0':'')+secs}
  ctx.restore()
  requestAnimationFrame(animate)
}

          'pxh-save-history':{currentState:'idle',badge:'',message:'',active:false,color:'#bc8cff'},
          'pxh-opencode':{currentState:'typing',badge:'Synced',message:'Terminal connected',active:true,color:'#00e5ff',activeTool:'monitoring'}
        },
        changedAgents:['pxh-help','pxh-pm','pxh-architect','pxh-expert','pxh-fix-bugs','pxh-qa','pxh-review-code','pxh-devops','pxh-ui-ux','pxh-opencode']
      })
    }, 100)
  }catch(e){}
  state.startTime=Date.now()
  requestAnimationFrame(animate)
}

init()
console.log('post-init animated')
</script>
