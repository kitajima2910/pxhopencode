<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%}
:root{
  --bg:#0a0e17; --surface:#111620; --border:rgba(255,255,255,0.06);
  --t1:#58a6ff; --t2:#d29922; --t3:#3fb950; --t4:#bc8cff;
  --wall-top:#1a1f2e; --wall-bot:#141820;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:#c9d1d9;overflow:hidden;user-select:none}
#app{width:100%;height:100%;display:flex;flex-direction:column}
.title-bar{display:flex;align-items:center;justify-content:space-between;padding:5px 16px;background:rgba(255,255,255,0.02);border-bottom:1px solid var(--border);flex-shrink:0}
.title-bar h1{font-size:13px;font-weight:600;letter-spacing:0.3px;background:linear-gradient(90deg,#58a6ff,#bc8cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.title-bar .ver{font-size:9px;opacity:0.25}
#canvasWrap{flex:1;position:relative;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.status-bar{display:flex;align-items:center;gap:14px;padding:5px 16px;background:rgba(0,0,0,0.4);border-top:1px solid var(--border);flex-shrink:0;font-size:11px}
.st-item{display:flex;align-items:center;gap:3px;opacity:0.7}
.st-item .lbl{font-size:9px;opacity:0.4;text-transform:uppercase;letter-spacing:0.5px}
.st-item .val{font-weight:600;font-size:11px}

#logOverlay{display:none}
.log-item{font-size:10px;padding:3px 12px;margin:2px 0;background:rgba(0,0,0,0.8);border-radius:4px;border-left:2px solid rgba(255,255,255,0.2);animation:slideUp .25s ease-out;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(4px)}
@keyframes slideUp{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
#dbgOverlay{scrollbar-width:thin;scrollbar-color:rgba(0,255,0,0.2) transparent}
#dbgOverlay::-webkit-scrollbar{width:4px}
#dbgOverlay::-webkit-scrollbar-thumb{background:rgba(0,255,0,0.25);border-radius:2px}
#pxhTermInput{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;z-index:10}
#pxhTermInput:focus{outline:none}
</style>
</head>
<body>
<div id="app">
  <div class="title-bar">
    <h1>🏢 Error404Labs - PXH2910</h1>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="ver">AI Company · 4-tier Runtime</span>
    </div>
  </div>
  <div id="canvasWrap"><canvas id="c"></canvas><div id="logOverlay"></div><input id="pxhTermInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div>
  <div id="dbgOverlay" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:999;display:none;width:360px;max-height:70vh;font:10px monospace;color:#0f0;background:rgba(0,0,0,0.9);padding:12px;border-radius:12px;border:1px solid rgba(0,255,0,0.3);user-select:text;overflow-y:auto;white-space:pre;word-wrap:break-word">⏳ loading...</div>
  <div id="jsMarker" style="position:absolute;bottom:40px;left:4px;z-index:999;font:12px monospace;color:#f80;background:rgba(0,0,0,0.9);padding:2px 6px;border-radius:3px;border:1px solid #f80">JS: WAITING</div>
  <div class="status-bar" id="statusBar">
    <div class="st-item"><span class="lbl">Workflow</span><span class="val" id="wfVal">—</span></div>
    <div class="st-item"><span class="lbl">Phase</span><span class="val" id="phVal">—</span></div>
    <div class="st-item"><span class="lbl">Elapsed</span><span class="val" id="elVal">00:00:00</span></div>
    <div style="flex:1"></div>
    <div class="st-item"><span id="modeTxt" style="opacity:0.8">⚪ Idle</span></div>
    <div class="st-item"><span id="sndToggle" style="cursor:pointer;opacity:0.5" title="Toggle sound">🔊</span></div>
    <div class="st-item"><span id="dbgToggle" style="cursor:pointer;opacity:0.5" title="Toggle debug">🐛</span></div>
  </div>
</div>

<script nonce="NONCE">/* OFFICE_JS */</script>
<script nonce="NONCE">
(function(){
  try{
    var m=document.getElementById('jsMarker');
    if(m)m.textContent='JS: ALIVE '+new Date().toLocaleTimeString();
  }catch(e){}

  try{resize()}catch(e){}

  try{
    var cEl=document.getElementById('c');
    var info='W='+(typeof W!=='undefined'?W:'?')+' H='+(typeof H!=='undefined'?H:'?')+' cW='+(cEl?cEl.width:'?')+' cH='+(cEl?cEl.height:'?');
    var d=document.getElementById('dbgOverlay');
    if(d)d.textContent='Canvas: '+info+'\n'+d.textContent;
  }catch(e){}

  try{if(typeof init==='function')init()}catch(e){}

  try{
    var d2=document.getElementById('dbgOverlay');
    if(d2)d2.textContent='post-init\n'+d2.textContent;
  }catch(e){}

  try{
    var o=document.getElementById('dbgOverlay');
    if(o)o.style.display='none';
  }catch(e){}

  try{
    var dt=document.getElementById('dbgToggle');
    if(dt)dt.addEventListener('click',function(e){
      var o=document.getElementById('dbgOverlay');
      if(o)o.style.display=o.style.display==='none'?'block':'none';
    });
  }catch(e){}
})();
</script>
</body>
